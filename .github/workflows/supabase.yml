# Pubblica database e funzioni AI su Supabase a ogni modifica in supabase/ sul ramo main.
# Si può anche avviare a mano da GitHub: Actions > Supabase > Run workflow.
#
# Segreti da impostare in GitHub (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token personale (supabase.com > Account > Access tokens)
#   SUPABASE_PROJECT_REF   l'identificativo del progetto (Project Settings > General)
#   SUPABASE_DB_PASSWORD   la password del database scelta alla creazione del progetto
# Le chiavi AI (Anthropic, OpenAI, ElevenLabs) NON stanno qui: si inseriscono nel
# pannello Supabase, Edge Functions > Secrets.
name: Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Collega il progetto
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Applica le migrazioni del database
        run: supabase db push --remote --include-all
      - name: Pubblica le funzioni AI
        run: supabase functions deploy esaminatore trascrivi voce --project-ref "$PROJECT_REF"
